name: fuzz

# Native Go fuzzing (fuzz_test.go, release/fuzz_test.go; `make fuzz`).
# The seeds already run as tests in every `make test`; this explores.
# PRs/pushes: every target 15 s against the cached corpus; nightly: 5 min
# per target, growing the corpus (the Go fuzz cache in GOCACHE/fuzz).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: time per target (Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (go native)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: restore the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: go-fuzz-corpus-${{ github.run_id }}
          restore-keys: go-fuzz-corpus-
      - name: fuzz every target
        run: |
          t=15s
          if [ "${{ github.event_name }}" = schedule ]; then t=5m; fi
          if [ -n "${{ inputs.fuzztime }}" ]; then t="${{ inputs.fuzztime }}"; fi
          make fuzz FUZZTIME="$t"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            testdata/fuzz
            release/testdata/fuzz
          retention-days: 30
