name: fuzz

# Native Go fuzzing (fuzz_test.go, release/fuzz_test.go; `make fuzz`).
# The seeds already run as tests in every `make test`; this explores.
# PRs/pushes: every target 15 s against the cached corpus; nightly: 5 min
# per target, growing the corpus (the Go fuzz cache in GOCACHE/fuzz).
# W37: on PRs only when Go code, modules or fuzz seeds change
# (scripts/ci-changes.sh group `fuzz`) or with the `full-ci` label; always
# on main, nightly, dispatch and from release.yml (workflow_call).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "11 4 * * *"
  workflow_call:
    inputs:
      fuzztime:
        description: time per target (empty = the PR default)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      fuzztime:
        description: time per target (Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.c.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = true ]; then scripts/ci-changes.sh full; else scripts/ci-changes.sh HEAD^1 HEAD; fi

  fuzz:
    name: fuzz (go native)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: restore the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: go-fuzz-corpus-${{ github.run_id }}
          restore-keys: go-fuzz-corpus-
      - name: fuzz every target
        run: |
          t=15s
          if [ "${{ github.event_name }}" = schedule ]; then t=5m; fi
          if [ -n "${{ inputs.fuzztime }}" ]; then t="${{ inputs.fuzztime }}"; fi
          make fuzz FUZZTIME="$t"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            testdata/fuzz
            release/testdata/fuzz
          retention-days: 30
