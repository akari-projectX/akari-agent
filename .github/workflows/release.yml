name: release

# Tag `vX.Y.Z` (commit must be on main): static linux amd64/arm64 binaries
# with version + commit stamped, CycloneDX SBOM, SHA256SUMS, cosign keyless
# signatures (GitHub OIDC), GitHub Release. Verification recipe:
# akari-panel docs/DEPLOY.md ("Verify a release").
#
# Third-party actions are pinned to commit SHAs (comment = tag).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same gate as CI, on the exact commit that is released.
      - run: make fmt-check vet check-third-party test
      # A reachable vulnerability blocks the release (allow-list in the Makefile).
      - run: make vulncheck
      - name: build
        run: |
          make dist VERSION="$GITHUB_REF_NAME" COMMIT="$(git rev-parse --short=12 "$GITHUB_SHA")"
          dist/akari-agent-linux-amd64 -version
          [ "$(dist/akari-agent-linux-amd64 -version | cut -d' ' -f2)" = "$GITHUB_REF_NAME" ]
          # R19: the binary carries its licensing (GPL-3.0-or-later combined work).
          dist/akari-agent-linux-amd64 -licenses | cmp - dist/THIRD_PARTY_LICENSES.txt
      # M6 self-update: Ed25519-signed manifests (what agents verify, with
      # the keys pinned in release-keys.txt). The private key lives only in
      # the AKARI_RELEASE_SIGNING_KEY secret (akari-sign keygen; see README
      # "Release signing keys"). No secret -> no manifests, with a warning:
      # such a release cannot be rolled out through the panel.
      - name: self-update manifests
        env:
          AKARI_RELEASE_SIGNING_KEY: ${{ secrets.AKARI_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$AKARI_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::AKARI_RELEASE_SIGNING_KEY not set: no signed self-update manifests in this release"
            exit 0
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          make sign-manifest VERSION="$GITHUB_REF_NAME" KEY_ENV=AKARI_RELEASE_SIGNING_KEY
          for a in amd64 arm64; do
            go run ./cmd/akari-sign verify -keys release-keys.txt \
              -manifest "dist/akari-agent-linux-$a.manifest.json" -sig "dist/akari-agent-linux-$a.manifest.sig" \
              -binary "dist/akari-agent-linux-$a" \
              || { echo "::error::manifest does not verify under the pinned release keys (release-keys.txt)"; exit 1; }
          done
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/akari-agent-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: checksums and signatures
        working-directory: dist
        run: |
          files="akari-agent-linux-amd64 akari-agent-linux-arm64 akari-agent-${GITHUB_REF_NAME}.cdx.json THIRD_PARTY_LICENSES.txt"
          files="$files $(ls akari-agent-linux-*.manifest.json akari-agent-linux-*.manifest.sig 2>/dev/null | tr '\n' ' ')"
          # shellcheck disable=SC2086
          sha256sum $files > SHA256SUMS
          # Keyless: the certificate binds each signature to this workflow
          # run (identity = this workflow at this tag, issuer = GitHub OIDC).
          for f in $files SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # R19: the licensing statement leads the notes (the generated
          # changelog follows it).
          cat >"$RUNNER_TEMP/notes.md" <<'EOF'
          ## Licensing

          akari-agent's own source code is MIT licensed. The release **binaries** statically link
          `github.com/sagernet/sing` and `sing-shadowsocks` (GPL-3.0-or-later, through xray-core's
          Shadowsocks support), so each binary is a combined work distributed under
          **GPL-3.0-or-later**. Corresponding source is this tag (`make dist` reproduces the binary).
          Every linked module and its licence text: `THIRD_PARTY_LICENSES.txt` (also printed by
          `akari-agent -licenses`).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" $prerelease \
            --title "$GITHUB_REF_NAME"
