// Akari panel <-> agent control-plane contract.
//
// Transport: the agent dials OUT to the panel's gRPC port over TLS. The
// agent's client certificate is issued by the panel CA and identifies the
// node; no management port exists on the agent side.
//
// Client certificates are OPTIONAL at the TLS layer (a presented one must
// still verify against the panel CA) so that a fresh agent can reach
// AgentEnrollment.Enroll. Every AgentChannel method requires a verified
// client certificate and refuses the call (UNAUTHENTICATED) without one.
syntax = "proto3";

package akari.v1;

option go_package = "akari/agent/pb";

// Requires a verified client certificate on every method.
service AgentChannel {
  // Persistent bidirectional stream. The agent keeps it open for its whole
  // lifetime; the panel pushes config / user deltas on the same stream.
  rpc OpenChannel(stream AgentUp) returns (stream PanelDown);
  // Certificate rotation (protocol >= 2). The caller is identified by its
  // client certificate; the CSR carries a NEW key (same rules as
  // EnrollRequest.csr_der). The panel records the new serial; the calling
  // certificate stays valid until the new one is first seen on a
  // connection (then it is revoked) or until it expires. Calling again with
  // the old certificate before the new one was seen replaces the unseen
  // one (it is revoked), so an agent that lost the answer simply retries.
  // Errors: UNAUTHENTICATED (no/unknown/revoked certificate),
  // FAILED_PRECONDITION (node being deleted), INVALID_ARGUMENT (bad CSR),
  // RESOURCE_EXHAUSTED (rate limited), UNAVAILABLE (retry later).
  rpc Renew(RenewRequest) returns (IssuedCertificate);
  // Agent self-update artifact download (protocol >= 3, M6). Streams the
  // bytes of a release binary the panel holds, identified by its SHA-256
  // (from a signed manifest in an UpdateOffer), starting at `offset`
  // (resume). The panel only serves releases whose upload completed and
  // whose manifest verified; the AGENT verifies size, SHA-256 and the
  // manifest signature itself before using anything. Errors:
  // UNAUTHENTICATED (no/unknown/revoked certificate), NOT_FOUND (unknown
  // or incomplete artifact), INVALID_ARGUMENT (bad digest/offset),
  // RESOURCE_EXHAUSTED (too many concurrent downloads; retry later),
  // UNAVAILABLE (retry later).
  rpc FetchArtifact(FetchArtifactRequest) returns (stream ArtifactChunk);
}

// Callable WITHOUT a client certificate (server TLS is still verified by
// the agent against the CA from its bootstrap file).
service AgentEnrollment {
  // Exchange a one-time enrollment token (from `akari node add` / the admin
  // API) and a CSR for the node's first client certificate. The token is
  // single use and expires (default 24h). Every token problem (unknown,
  // used, expired, node being deleted) is the same PERMISSION_DENIED
  // "enrollment refused". INVALID_ARGUMENT: bad CSR (checked before the
  // token, which stays unused). RESOURCE_EXHAUSTED: rate limited (per source
  // address and globally). UNAVAILABLE: retry later (token unused).
  rpc Enroll(EnrollRequest) returns (IssuedCertificate);
}

message EnrollRequest {
  string token = 1;
  // PKCS#10 CSR (DER) for an ECDSA P-256 key generated on the node, signed
  // with ecdsa-with-SHA256. It must carry no attributes (no extension
  // request: no SANs, no key usages); the subject is ignored. The panel
  // decides every field of the certificate: subject CN=agent-<node id>,
  // ClientAuth only, a fresh random serial, its configured validity.
  bytes csr_der = 2;
}

message RenewRequest {
  bytes csr_der = 1; // as EnrollRequest.csr_der, for a NEW key
}

message IssuedCertificate {
  string cert_pem = 1; // the node's client certificate (leaf only)
  string ca_pem = 2;   // the panel CA that issued it
}

message AgentInfo {
  string agent_version = 1;
  string core_version = 2; // embedded xray-core version
  string os = 3;
  string arch = 4;
}

// First message on every stream, and re-sent whenever the agent rebuilds
// its xray instance (traffic counters reset -> new session_id) or tears it
// down (lease expiry).
message Hello {
  string session_id = 1;     // fresh whenever traffic counters reset
  uint64 config_version = 2; // inbound config the agent currently holds
  uint64 user_version = 3;   // user set the agent currently holds
  AgentInfo info = 4;
  // Control-protocol revision the agent speaks. Agents that predate the
  // field send 0. The panel serves agents below its MIN_AGENT_PROTOCOL the
  // EMPTY desired state (no inbounds, no users) and never trusts their
  // Hello/Ack for convergence. Revisions:
  //   1 = UserDelta base/target + REPLACE semantics, Ack.reason/held_*,
  //       state_hash, LeaseGrant.
  //   2 = renews its certificate (AgentChannel.Renew). Protocol 1 agents
  //       are served as before; they just never rotate their certificate.
  //   3 = signed self-update (UpdateOffer, FetchArtifact, UpdateStatus).
  //       Protocol 1/2 agents are served as before; they are never
  //       offered an update.
  uint32 protocol_version = 5;
  // State hash of what the agent actually runs (see "State hash" below),
  // for config_version + the applied user set. Empty for protocol 0.
  string state_hash = 6;
}

// State hash (protocol >= 1), lowercase hex SHA-256 over:
//   "akari-state-v2\n"
//   u64 big-endian config_version (the held inbound config version)
//   then, for every applied (user_id, inbound_tag) record, sorted by
//   user_id then inbound_tag (bytewise), the four fields
//   user_id, inbound_tag, protocol, account_json, each encoded as
//   u32 big-endian byte length followed by the UTF-8 bytes;
//   then u32 big-endian 32 followed by SHA-256(inbounds_json), where
//   inbounds_json is ConfigSnapshot.inbounds_json VERBATIM as sent for the
//   running instance ("" when no instance runs: before the first Snapshot,
//   after a failed Rebuild, after lease expiry).
// Records: each (user_id, inbound_tag) pair appears at most once; within one
// UserOp a later InboundUser for the same inbound_tag replaces an earlier
// one. Users with no inbound left contribute nothing. account_json is hashed
// VERBATIM as carried in InboundUser.account_json (never re-serialized): the
// panel emits it canonically (compact JSON, object keys sorted) and the
// agent hashes exactly the bytes it applied. Shared test vectors:
// proto/state_hash_vectors.json, generated by the independent reference
// implementation proto/testdata/gen_vectors.py (both repos test against it).

message Heartbeat {
  double cpu_percent = 1;
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  // Proxied connections currently open through xray (the gate's tracked
  // dispatches; 0 when no instance runs).
  uint64 connections = 4;
  // Seconds since the agent process started.
  uint64 uptime_seconds = 5;
  // Seconds left on the fail-closed lease (see LeaseGrant); unset while no
  // lease is armed (no grant received since the agent started).
  optional uint64 lease_remaining_seconds = 6;
}

message UserTraffic {
  string user_id = 1;   // panel user id; also the xray user "email" field
  uint64 up_bytes = 2;  // cumulative within the current session
  uint64 down_bytes = 3;
}

message TrafficReport {
  repeated UserTraffic users = 1;
  uint64 monotonic_ms = 2;
  // Session (xray instance lifetime) these counters belong to, read
  // atomically with them. The panel keys accounting on it and DROPS reports
  // without it (agents must be upgraded before the panel).
  string session_id = 3;
}

// Result of applying a Snapshot/Delta. Versions are the ATTEMPTED ones
// (the target); on ok=false the agent keeps (and reports in Hello) its
// previous versions.
message Ack {
  uint64 config_version = 1;
  uint64 user_version = 2;
  bool ok = 3;
  string error = 4;

  enum Reason {
    REASON_UNSPECIFIED = 0;  // protocol 0 agent: use `ok`
    REASON_OK = 1;
    // The apply was attempted and failed (possibly partially). The panel
    // falls back to a Snapshot under its failure backoff.
    REASON_APPLY_FAILED = 2;
    // A UserDelta whose base is not what the agent holds (or the agent's
    // state is dirty after a failed delta). Nothing was changed; the panel
    // sends a Snapshot at once (not a failure, no backoff).
    REASON_BASE_MISMATCH = 3;
  }
  Reason reason = 5;           // protocol >= 1
  // What the agent holds AFTER handling the message (protocol >= 1).
  uint64 held_config_version = 6;
  uint64 held_user_version = 7;
  // State hash of the held state (see Hello.state_hash).
  string state_hash = 8;
}

message AgentUp {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TrafficReport traffic = 3;
    Ack ack = 4;
    UpdateStatus update_status = 5; // protocol >= 3
  }
}

// One protocol account for one inbound. account_json follows the xray
// per-protocol account schema, e.g. {"id": "...", "flow": "xtls-rprx-vision"}
// for VLESS or {"password": "..."} for Trojan. protocol names the account
// type ("vless", "vmess", "trojan", "shadowsocks").
message InboundUser {
  string inbound_tag = 1;
  string account_json = 2;
  string protocol = 3;
}

// ADD has REPLACE semantics (protocol >= 1): the user ends up on EXACTLY
// the listed inbounds; tags not listed are removed, a changed account is
// swapped (and that user's live connections on the changed/removed tags are
// closed), an identical account is left untouched. REMOVE removes the user
// from every inbound and closes their live connections. Both are
// idempotent.
message UserOp {
  enum Op {
    ADD = 0;
    REMOVE = 1;
  }
  Op op = 1;
  string user_id = 2;
  repeated InboundUser inbound_users = 3; // ignored for REMOVE
}

// Full desired state, sent when the agent's held versions mismatch the
// panel's. Contains the complete user set so the agent can converge from
// any state without a diff protocol.
message ConfigSnapshot {
  uint64 config_version = 1;
  string inbounds_json = 2; // xray "inbounds" array JSON
  uint64 user_version = 3;
  repeated UserOp users = 4; // complete desired user set
}

// Incremental user-set change (protocol >= 1). Applies only on top of
// base: the agent applies it iff it holds exactly (base_config_version,
// base_user_version); if it already holds the target (config_version,
// user_version) it acks ok without changing anything (idempotent resend);
// otherwise it answers REASON_BASE_MISMATCH and keeps its state. A delta
// never changes inbounds: config_version == base_config_version. On a
// (partial) failure the agent keeps the base versions, marks its state
// dirty (further deltas get BASE_MISMATCH until a Snapshot) and its
// state_hash reflects what actually applied.
message UserDelta {
  uint64 user_version = 1; // target user version, after applying all ops
  repeated UserOp ops = 2;
  uint64 base_config_version = 3;
  uint64 base_user_version = 4;
  uint64 config_version = 5; // target config version == base_config_version
}

// Fail-closed lease (protocol >= 1). Sent only after the panel successfully
// read this node's desired state from its database for this stream
// (initial sync and every reconcile). The agent measures it on a clock that
// keeps running during suspend (CLOCK_BOOTTIME), accepts grants only from
// its current stream, treats 0 as the 24h default and clamps to >= 1h. On
// expiry it tears xray down, resets its held versions to (0,0) (next Hello
// forces a Snapshot) and keeps the final counters for the next stream.
message LeaseGrant {
  uint64 duration_seconds = 1;
  // How user removals/rotations must be applied (panel config
  // agent.remove_mode). Carried on every grant, so it reaches the agent
  // with the first sync of each stream and before any Snapshot/UserDelta.
  RemoveMode remove_mode = 2;
}

enum RemoveMode {
  // In place (UserDelta); the agent's gate dispatcher closes the user's
  // live connections.
  REMOVE_MODE_GATE = 0;
  // Fallback switch: any removal or credential change goes through a full
  // Snapshot (xray rebuild, drops every connection on the node). The panel
  // sends no such deltas; the agent also refuses them (BASE_MISMATCH).
  REMOVE_MODE_REBUILD = 1;
}

message Noop {}

// --- Agent self-update (protocol >= 3, M6) --------------------------------
//
// Trust: the agent runs only binaries described by a manifest signed with
// an Ed25519 release key PINNED in the agent binary (never the panel's key,
// never a key the panel sends). The panel only relays: a compromised panel
// can withhold or delay updates, not push an unsigned, foreign-platform or
// downgraded binary.
//
// Manifest: UTF-8 JSON object, signed and transported VERBATIM (never
// re-serialized):
//   {"schema":1, "version":"v1.2.3", "os":"linux", "arch":"amd64",
//    "sha256":"<64 lowercase hex>", "size":<bytes>,
//    "min_panel_protocol":3, "created_at":"<RFC 3339>", "rollback":false}
// version is semver with a leading "v". The agent accepts it only if:
// some signature verifies under a pinned key; schema == 1; os/arch are its
// own; version > its running version (semver precedence) — or rollback is
// true (an explicitly signed rollback target), and never a version it
// already rolled back from; min_panel_protocol <= the offer's
// panel_protocol; size <= 256 MiB.
// Signature: Ed25519 over "akari-agent-manifest-v1\n" || manifest bytes.
// key_id: first 8 bytes of SHA-256(raw 32-byte public key), lowercase hex.
message ManifestSignature {
  string key_id = 1;
  bytes signature = 2; // 64 bytes
}

// Offer to update. Sent by the panel at most once per stream and rollout
// (re-sent on a new stream while the node's rollout entry is open). The
// agent answers with UpdateStatus (REJECTED on any check failure, else
// DOWNLOADING ... RESTARTING); a duplicate offer of the version it is
// already working on is ignored.
message UpdateOffer {
  string rollout_id = 1; // opaque, echoed in UpdateStatus
  bytes manifest = 2;    // the signed bytes, verbatim
  repeated ManifestSignature signatures = 3; // any one valid suffices
  // The panel's control-protocol revision (the manifest's
  // min_panel_protocol must not exceed it).
  uint32 panel_protocol = 4;
}

message FetchArtifactRequest {
  string sha256 = 1; // lowercase hex, from the manifest
  uint64 offset = 2; // resume position; 0 = from the start
}

message ArtifactChunk {
  bytes data = 1; // consecutive bytes from the requested offset, <= 1 MiB
}

// Progress / outcome of an update. Informational for the panel (its health
// gate is its own: a Hello with the new agent_version followed by an ok
// Ack within the rollout's timeout), except that REJECTED, FAILED and
// ROLLED_BACK mark the node failed at once.
message UpdateStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // The offer failed a check (signature, platform, version policy,
    // panel protocol, already rolled back from); nothing was downloaded.
    STATE_REJECTED = 1;
    STATE_DOWNLOADING = 2;
    // Download or verification failed, or the switch could not happen;
    // the running binary stays.
    STATE_FAILED = 3;
    // Verified and staged; final counters flushed; about to restart.
    STATE_RESTARTING = 4;
    // The new binary did not come up healthy (crashed on start, or no
    // connected + acked apply within the self-check timeout); the agent
    // went back to the previous binary. Sent by the binary that runs after
    // the rollback, after its Hello.
    STATE_ROLLED_BACK = 5;
    // The new binary passed its self-check (sent after its Hello + first
    // ok apply).
    STATE_CONFIRMED = 6;
  }
  string rollout_id = 1;
  string version = 2; // the offered / attempted version
  State state = 3;
  string error = 4;
}

message PanelDown {
  oneof msg {
    ConfigSnapshot snapshot = 1;
    UserDelta delta = 2;
    Noop noop = 3;
    LeaseGrant lease = 4;
    UpdateOffer update_offer = 5; // protocol >= 3
  }
}
